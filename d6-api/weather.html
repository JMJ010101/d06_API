<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #eef3f9; margin: 0; padding: 24px 16px; color: #1c2430; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); text-align: center; }
  .emoji { font-size: 72px; line-height: 1; }
  .temp { font-size: 48px; font-weight: 700; margin: 8px 0 0; }
  .desc { font-size: 20px; margin: 4px 0 0; }
  .loading { color: #5b6776; }
  .error { color: #b3261e; }
  .api-box { margin-top: 16px; background: #fff8e1; border: 1px solid #f0d98a; border-radius: 12px; padding: 14px; font-size: 13px; word-break: break-all; }
  .api-box code { display: block; margin: 6px 0; }
  footer { margin-top: 12px; font-size: 12px; color: #5b6776; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>🌤️ <span id="place"></span> 지금 날씨</h1>

  <div class="card" id="weather-card">
    <p class="loading">날씨 불러오는 중…</p>
  </div>

  <div class="api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <code id="api-url"></code>
    <a id="api-link" href="#" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </div>

  <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></footer>
</main>

<script>
  const API = {
    place: "서울",                                  // 🔌 동네 이름 (화면 제목용)
    latitude: 37.5665,                              // 🔌 위도 — 이 숫자를 바꾸면 다른 도시
    longitude: 126.9780,                            // 🔌 경도 — 이 숫자를 바꾸면 다른 도시
    base: "https://api.open-meteo.com/v1/forecast", // 🔌 Open-Meteo 날씨 주소 (키 필요 없음)
  };

  // 날씨 코드(WMO) → 말 + 이모지
  const WEATHER_CODES = {
    0: ["맑음", "☀️"],
    1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["짙은 안개", "🌫️"],
    51: ["가벼운 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌦️"],
    56: ["얼어붙는 이슬비", "🌧️"], 57: ["강한 얼어붙는 이슬비", "🌧️"],
    61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    66: ["얼어붙는 비", "🌧️"], 67: ["강한 얼어붙는 비", "🌧️"],
    71: ["약한 눈", "🌨️"], 73: ["눈", "❄️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
    95: ["천둥번개", "⛈️"], 96: ["우박 동반 천둥번개", "⛈️"], 99: ["강한 우박 동반 천둥번개", "⛈️"],
  };

  const url = `${API.base}?latitude=${API.latitude}&longitude=${API.longitude}&current=temperature_2m,weather_code&timezone=auto`;
  document.getElementById("place").textContent = API.place;
  document.getElementById("api-url").textContent = url;
  document.getElementById("api-link").href = url;

  const card = document.getElementById("weather-card");

  async function loadWeather() {
    try {
      const res = await fetch(url); // 🔌 API 호출
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const { temperature_2m: temp, weather_code: code, time } = data.current;
      const [text, emoji] = WEATHER_CODES[code] || ["알 수 없음 (코드 " + code + ")", "❓"];
      card.innerHTML = `
        <div class="emoji">${emoji}</div>
        <p class="temp">${temp}°C</p>
        <p class="desc">${text}</p>
        <p class="loading">기준 시각: ${time.replace("T", " ")}</p>`;
    } catch (err) {
      card.innerHTML = `<p class="error">😢 날씨를 불러오지 못했어요.<br>잠시 뒤 다시 열어 주세요. (${err.message})</p>`;
    }
  }
  loadWeather();
</script>
</body>
</html>
