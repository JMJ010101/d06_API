<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환율 계산기</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #eef3f9; margin: 0; padding: 24px 16px; color: #1c2430; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input, select { font-size: 18px; padding: 10px; border: 1px solid #c5cdd8; border-radius: 8px; }
  input { flex: 1; min-width: 0; }
  #result { text-align: center; }
  .won { font-size: 36px; font-weight: 700; margin: 4px 0; }
  .sub { font-size: 14px; color: #5b6776; margin: 4px 0 0; }
  .loading { color: #5b6776; }
  .error { color: #b3261e; }
  .api-box { margin-top: 16px; background: #fff8e1; border: 1px solid #f0d98a; border-radius: 12px; padding: 14px; font-size: 13px; word-break: break-all; }
  .api-box code { display: block; margin: 6px 0; }
  footer { margin-top: 12px; font-size: 12px; color: #5b6776; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>💱 환율 계산기 (기준 환율)</h1>

  <div class="card">
    <div class="row">
      <input id="amount" type="number" min="0" step="any" value="100" aria-label="금액">
      <select id="currency" aria-label="통화">
        <option value="USD">USD 🇺🇸 달러</option>
        <option value="JPY">JPY 🇯🇵 엔</option>
        <option value="EUR">EUR 🇪🇺 유로</option>
        <option value="CNY">CNY 🇨🇳 위안</option>
      </select>
    </div>
    <div id="result"><p class="loading">환율 불러오는 중…</p></div>
  </div>

  <div class="api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <code id="api-url"></code>
    <a id="api-link" href="#" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </div>

  <footer>
    환율: <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a> (유럽중앙은행 기준 환율, 하루 한 번 발표)
  </footer>
</main>

<script>
  const API = {
    base: "https://api.frankfurter.dev/v1/latest", // 🔌 Frankfurter 환율 주소 (키 필요 없음)
    to: "KRW",                                     // 🔌 바꿔 받을 통화 (원화)
  };

  const amountEl = document.getElementById("amount");
  const currencyEl = document.getElementById("currency");
  const resultEl = document.getElementById("result");
  const urlEl = document.getElementById("api-url");
  const linkEl = document.getElementById("api-link");
  const fmt = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 2 });

  async function convert() {
    const amount = parseFloat(amountEl.value);
    const from = currencyEl.value;
    if (!(amount >= 0)) {
      resultEl.innerHTML = `<p class="error">금액을 숫자로 입력해 주세요.</p>`;
      return;
    }
    const url = `${API.base}?amount=${amount}&base=${from}&symbols=${API.to}`;
    urlEl.textContent = url;
    linkEl.href = url;
    resultEl.innerHTML = `<p class="loading">환율 불러오는 중…</p>`;
    try {
      const res = await fetch(url); // 🔌 API 호출
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const won = data.rates[API.to];
      if (won === undefined) throw new Error("원화 값이 없어요");
      const unit = amount > 0 ? won / amount : 0;
      resultEl.innerHTML = `
        <p class="sub">${fmt.format(amount)} ${from} =</p>
        <p class="won">${fmt.format(won)}원</p>
        <p class="sub">1 ${from} = ${fmt.format(unit)}원</p>
        <p class="sub">기준 날짜: ${data.date} (유럽중앙은행 기준 환율, 하루 한 번 발표)</p>`;
    } catch (err) {
      resultEl.innerHTML = `<p class="error">😢 환율을 불러오지 못했어요.<br>잠시 뒤 다시 시도해 주세요. (${err.message})</p>`;
    }
  }

  amountEl.addEventListener("input", convert);
  currencyEl.addEventListener("change", convert);
  convert();
</script>
</body>
</html>
